name: Build Linux AppImage (custom model endpoints)

on:
  workflow_dispatch:
  push:
    branches:
      - build-linux-appimage-custom-endpoints

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build OpenWork AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application
        env:
          OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: "0"
        run: pnpm --filter @openwork/desktop run build:electron

      - name: Package AppImage
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.yml --linux AppImage --publish never

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/desktop/dist-electron/*.AppImage)
          if (( ${#files[@]} == 0 )); then
            echo "No AppImage was produced." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > apps/desktop/dist-electron/SHA256SUMS

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwork-linux-appimage-custom-model-endpoints
          path: |
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
